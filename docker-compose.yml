services:
  postgres:
    image: postgres:16-alpine
    container_name: sweety-postgres
    environment:
      POSTGRES_DB: sweety
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety_password
    ports:
      - "5432:5432"
    volumes:
      - sweety_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sweety-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sweety:sweety_password@postgres:5432/sweety
      JWT_SECRET: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sweety_pgdata:
